version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Dev dependencies only (the package has no runtime dependencies): batch them to keep the noise down.
    groups:
      dev-dependencies:
        dependency-type: development
