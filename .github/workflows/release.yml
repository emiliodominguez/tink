name: Release

# Publishes to npm when a version tag (e.g. v2.0.0) is pushed, using npm trusted publishing (OIDC): no long-lived npm token exists.
# One-time setup on npmjs.com → package settings → Trusted publishing: GitHub Actions, repository emiliodominguez/js-helpers,
# workflow `release.yml`, environment `npm`. Then create the `npm` environment in the repository settings (add required reviewers).
#
# The job that runs project code (dev dependencies, tests, doctests) has no publishing rights; the job that can publish runs no
# project code at all: it only uploads the tarball the first job built.
on:
  push:
    tags: ['v*.*.*']

permissions: {}

jobs:
  build:
    name: Validate and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check the tag matches package.json and points at main
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version ($expected)." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at a commit that is not on main." >&2
            exit 1
          fi

      # No install scripts: esbuild resolves its binary from its platform package, and husky is not needed in CI.
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn validate
      - run: npm pack --ignore-scripts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      # Trusted publishing needs npm >= 11.5.1; the tarball was validated by the build job, so no lifecycle scripts run here.
      - run: npm install --global npm@11
      - run: npm publish ./*.tgz --provenance --access public --ignore-scripts
